# Build and deploy the Vite app to GitHub Pages.
# Repo → Settings → Pages → Build and deployment: GitHub Actions → use this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `GITHUB_REPOSITORY` is set on GitHub-hosted runners; vite.config.js derives Vite `base` for Pages.
      - run: npm run build
        env:
          # Deployed MTI learner SPA the iframe loads (bootstrap + embedded app — match env to org token / backend).
          VITE_APP_FRONTEND_URL: https://app.dev.mockthatinterview.com
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
