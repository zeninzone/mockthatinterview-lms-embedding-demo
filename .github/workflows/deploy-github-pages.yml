# Build and deploy the Vite app to GitHub Pages.
# Repo → Settings → Pages → Build and deployment: GitHub Actions → use this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Multi-client build: picker at repo root, each partner under /<slug>/ (see scripts/build-github-pages.mjs).
      - run: npm run build
        env:
          VITE_APP_FRONTEND_URL: https://app.dev.mockthatinterview.com
          # Per-client secrets — each slug’s bundle only embeds its own token.
          MTI_ORG_API_TOKEN_AXIA: ${{ secrets.MTI_ORG_API_TOKEN_AXIA }}
          MTI_ORG_API_TOKEN_CYF: ${{ secrets.MTI_ORG_API_TOKEN_CYF }}
          CYF_ORGANIZATION_ID: ${{ secrets.CYF_ORGANIZATION_ID }}
          # Legacy repo secret name (Axia bootstrap only) until renamed to MTI_ORG_API_TOKEN_AXIA
          VITE_MTI_ORG_API_TOKEN: ${{ secrets.VITE_MTI_ORG_API_TOKEN }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
